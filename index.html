<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trasferte">
<title>Trasferte</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- ?v= : cambiare il numero a OGNI modifica di style.css/app.js (stesso numero di CACHE in sw.js).
     Cambiando l'URL, nessuna cache puo' servire la versione vecchia. -->
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo">⛳</span><span id="title">Trasferte</span></div>
  <div class="right">
    <span id="netdot" class="dot on" title="online"></span>
    <button id="whoBtn" class="chip"></button>
    <!-- T10 giro 3: "Altro" non e' piu' un tab, e' l'ingranaggio (e il chip del nome apre lo stesso foglietto) -->
    <button id="gearBtn" class="chip gear" title="Altro">⚙️</button>
  </div>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-v="oggi"><span>🏠</span>Oggi</button>
  <button data-v="trasferte"><span>🧳</span>Trasferte</button>
  <button data-v="add" class="fab"><span>＋</span></button>
  <button data-v="posta"><span>📬</span>Posta<i id="navBadge" class="badge hidden"></i></button>
  <button data-v="soldi"><span>💶</span>Soldi</button>
</nav>

<div id="modal" class="modal hidden"><div class="sheet"><div class="grab"></div><div id="modalBody"></div></div></div>
<!-- secondo strato: chiediTesto(), chiediConferma() e il foglietto d'aiuto aperto
     da dentro il modulo. Chi li chiama e' quasi sempre gia' dentro il modulo (il
     nome di una trasferta nuova, Elimina, il "?"): un solo strato lo cancellerebbe. -->
<div id="modal2" class="modal hidden"><div class="sheet"><div class="grab"></div><div id="modal2Body"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js?v=38"></script>
</body>
</html>
